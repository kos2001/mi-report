[project]
name = "mi-report-backend"
version = "0.1.0"
description = "MI Report Agent backend — agno + OpenRouter(OpenAI 호환) LLM 으로 MI 자동화"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "agno>=2.6",          # LLM 엔진(OpenRouter 모델 래핑)
    "openai>=1.0",        # agno OpenRouter 백엔드 의존
    "pypdf>=4.0",         # 한경 컨센서스 리포트 PDF 본문 추출
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# COM 인제스트 워커 (Windows 전용 — DRM 클라이언트 + MS Office 설치 환경)
windows = [
    "pywin32>=306",
]
# 의미 임베딩 하이브리드 검색 (로컬 fastembed — 외부 API 없음, 데이터 유출 없음).
# 활성화: 이 그룹 설치 + 환경변수 MI_EMBEDDINGS=1.
embeddings = [
    "fastembed>=0.4",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
