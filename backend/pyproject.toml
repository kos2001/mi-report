[project]
name = "mi-report-backend"
version = "0.1.0"
description = "MI Report Agent backend — Hermes Gateway(OpenAI 호환)를 통해 Hermes Agent 전체 기능 사용"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# COM 인제스트 워커 (Windows 전용 — DRM 클라이언트 + MS Office 설치 환경)
windows = [
    "pywin32>=306",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
