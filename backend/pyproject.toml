[project]
name = "mi-report-backend"
version = "0.1.0"
description = "MI Report Agent backend — agno + OpenRouter(OpenAI 호환) LLM 으로 MI 자동화"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "agno>=2.6",          # LLM 엔진(OpenRouter 모델 래핑)
    "openai>=1.0",        # agno OpenRouter 백엔드 의존
    "pypdf>=4.0",         # 한경 컨센서스 리포트 PDF 본문 추출
    "authlib>=1.3",       # SSO(OIDC) — discovery·PKCE·JWKS 서명 검증
    "itsdangerous>=2.2",  # OIDC 로그인↔콜백 왕복 동안만 쓰는 세션 쿠키 서명
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# COM 인제스트 워커 (Windows 전용 — DRM 클라이언트 + MS Office 설치 환경)
windows = [
    "pywin32>=306",
]
# 의미 임베딩 하이브리드 검색 (로컬 fastembed — 외부 API 없음, 데이터 유출 없음).
# 활성화: 이 그룹 설치 + 환경변수 MI_EMBEDDINGS=1.
embeddings = [
    "fastembed>=0.4",
    "numpy>=1.26",
]
# PDF 고속 텍스트 추출(PyMuPDF — 파이썬 PDF 파서 중 최고 속도).
# 미설치 시 pypdf(한경)/Word COM(워커)로 폴백. 주의: AGPL-3.0(외부 배포 시 검토).
pdf = [
    "pymupdf>=1.24",
]
# OOXML(docx/xlsx/pptx) 고속 텍스트 추출 — Office 기동 없이 zip+XML 직접 파싱.
# DRM 문서는 시그니처가 깨져 자연히 실패 → COM 폴백. 미설치 시 항상 COM.
office = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]
# 문서 이미지 OCR(RapidOCR/onnxruntime, 로컬 — 외부 API 없음).
# 스캔 PDF 페이지 + OOXML 내장 이미지의 텍스트를 색인에 회수. 끄기: MI_OCR=0.
# 한국어 인식 모델은 MI_OCR_REC_MODEL 로 교체(기본은 중·영문).
ocr = [
    "rapidocr-onnxruntime>=1.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
