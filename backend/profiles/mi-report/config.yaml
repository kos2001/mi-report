# MI Report 전용 LLM 연결 프로파일 — agno + OpenRouter (OpenAI 호환)
# 참조: gitspace/lsi_error_analyzer. LLM 호출은 app/gateway.py(LLMClient)가
# OPENROUTER_* 환경변수(.env)를 직접 읽어 agno 의 OpenRouter 모델로 수행한다.

model:
  default: "deepseek/deepseek-v4-flash"  # OPENROUTER_MODEL 로 재정의 가능
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"

# OpenAI 호환 provider 정의. api_key 는 .env 의 key_env 변수에서 읽는다.
# 사내 LLM 게이트웨이 사용 시: base_url 을 사내 엔드포인트로 바꾸고, .env 에
# LLM_SERVICE_ID / LLM_USER_ID 를 채우면 매 요청에 x-service-id / x-user-id 헤더가 첨부된다.
providers:
  openrouter:
    type: "openai-compatible"
    base_url: "https://openrouter.ai/api/v1"
    key_env: "OPENROUTER_API_KEY"
    extra_headers:
      {}

fallback_providers: []

# 호출 기본값
agent:
  request_timeout: 120
  api_max_retries: 3
