# Hermes Gateway 연결 프로파일 (OpenAI 호환)
# 구조는 hermes-desktop-new 의 profile config.yaml 을 따른다.
# (model.default / model.provider / model.base_url + providers 맵)

model:
  default: "hermes-agent"          # Hermes Gateway 가 /v1/models 로 광고하는 모델명
  provider: "hermes-gateway"       # 아래 providers 맵의 키와 일치
  base_url: "http://127.0.0.1:8642/v1"

# OpenAI 호환 provider 정의.
# api_key 는 .env 의 key_env 변수에서 읽는다 (코드에 키를 넣지 않는다).
providers:
  hermes-gateway:
    type: "openai-compatible"
    base_url: "http://127.0.0.1:8642/v1"
    key_env: "HERMES_GATEWAY_API_KEY"
    # Hermes Gateway 전용 헤더(선택). 세션 연속성/메모리 스코프에 사용.
    extra_headers:
      # X-Hermes-Session-Id: 동일 세션으로 대화를 이어가고 싶을 때 사용
      # X-Hermes-Session-Key: 장기 메모리 스코프 분리
      {}

fallback_providers: []

# 에이전트 호출 기본값
agent:
  max_turns: 30
  request_timeout: 1800
  api_max_retries: 3
  reasoning_effort: medium
