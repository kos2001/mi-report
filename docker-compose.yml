# MI Report Agent — 백엔드 + 프론트엔드 로컬 오케스트레이션
# 사용: OPENROUTER_API_KEY 등은 backend/profiles/mi-report/.env 에 두고 `docker compose up --build`
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MI_EMBEDDINGS=1
      - MI_EMBED_MODEL=intfloat/multilingual-e5-large
      # 스케줄 페이지에서 설정한 주기(매일/매주)가 실제로 자동 실행되게 함(꺼져 있으면
      # UI에서 주기를 설정해도 앱 안에서는 아무 일도 일어나지 않고 crontab 라인만 안내됨).
      - MI_SCHEDULER=1
    env_file:
      - ./backend/profiles/mi-report/.env   # OPENROUTER_API_KEY / CONFLUENCE_* 등
    volumes:
      - mi-data:/app/data                   # 수집 DB·업로드 영속화

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mi-data:
